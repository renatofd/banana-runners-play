<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Banana Runners</title>
  <style>
    /* a Fredoka no negrito de todos os textos do jogo, com as letras do turco (tools/build_fredoka.py) */
    @font-face { font-family: 'Fredoka'; src: url('assets/fonts/Fredoka-Bold.woff') format('woff'); font-weight: 700; }
    /* sem seleção de texto nem menu de toque longo (exigência do CrazyGames no celular) */
    html, body { margin: 0; height: 100%; background: #12200f; overflow: hidden; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* o jogo fica dentro da área segura (entalhe e cantos arredondados, como no app do CrazyGames em tela cheia):
       o Phaser mede o tamanho deste div, e a sobra fora dele fica na cor do fundo */
    #game { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      display: flex; align-items: center; justify-content: center; }
    /* força o carregamento da fonte antes do Phaser desenhar textos */
    .font-preload { font-family: 'Fredoka'; position: absolute; left: -999px; visibility: hidden; }
  </style>
  <script type="module" crossorigin src="./assets/index-PxQzho6Q.js"></script>
</head>
<body>
  <div class="font-preload">Banana</div>
  <div id="game"></div>
</body>
</html>
